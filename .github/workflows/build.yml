name: Build Kren Debug

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # dev/bypass and x10n/flatslice are written with intermediary names (class_310 ...),
      # but the project compiles against Yarn, so remap them before building.
      - name: Download Yarn mappings
        run: |
          YARN=$(grep '^yarn_mappings=' gradle.properties | cut -d= -f2)
          curl -fsSL -o yarn.jar "https://maven.fabricmc.net/net/fabricmc/yarn/${YARN}/yarn-${YARN}-v2.jar"

      - name: Remap intermediary -> Yarn
        run: python3 tools/remap_intermediary.py yarn.jar src/main/java/dev/bypass src/main/java/x10n

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build

      - uses: actions/upload-artifact@v4
        with:
          name: kren-debug
          path: project/build/libs/*.jar
