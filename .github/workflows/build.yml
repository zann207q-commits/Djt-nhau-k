name: Build Kren Debug

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""

          for candidate in \
            "kren debug fixed.zip" \
            "kren-debug-fixed.zip" \
            "kren-debug-with-foid-debug-src.zip"; do
            if [[ -f "$candidate" ]]; then
              ARCHIVE="$candidate"
              break
            fi
          done

          if [[ -z "$ARCHIVE" ]]; then
            ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi

          if [[ -z "$ARCHIVE" || ! -f "$ARCHIVE" ]]; then
            echo "ERROR: No source ZIP found in repository root."
            echo "Upload your source ZIP beside the .github folder."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          rm -rf project
          mkdir -p project
          unzip -q "$ARCHIVE" -d project

          ROOT="project"

          if [[ ! -f "$ROOT/gradlew" ]]; then
            ROOT="$(find project -type f -name gradlew -print -quit | xargs -r dirname)"
          fi

          if [[ -z "$ROOT" || ! -f "$ROOT/gradlew" ]]; then
            echo "ERROR: gradlew not found in ZIP."
            echo "Checking for Gradle build files..."

            find project -maxdepth 5 -type f \
              \( -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
              -o -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \) \
              -print

            exit 1
          fi

          if [[ "$ROOT" != "project" ]]; then
            mv "$ROOT" project-root
            rm -rf project
            mv project-root project
          fi

          chmod +x project/gradlew

          echo "Project root:"
          ls -la project

          if [[ ! -f project/settings.gradle && \
                ! -f project/settings.gradle.kts ]]; then
            echo "WARNING: Gradle settings file not found at root."
          fi

      - name: Build with Gradle
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean build

      - name: Upload JAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kren-debug-build
          path: |
            project/build/libs/*.jar
            project/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
