name: Build Kren Debug

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the renamed archive; otherwise use the first ZIP in the repository root.
          ARCHIVE=""
          for candidate in "kren debug fixed.zip" "kren-debug-fixed.zip" "kren-debug-with-foid-debug-src.zip"; do
            if [[ -f "$candidate" ]]; then
              ARCHIVE="$candidate"
              break
            fi
          done

          if [[ -z "$ARCHIVE" ]]; then
            ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi

          if [[ -z "$ARCHIVE" || ! -f "$ARCHIVE" ]]; then
            echo "ERROR: No source ZIP found in the repository root."
            echo "Upload the source ZIP to the root of the repository."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          rm -rf project
          mkdir -p project
          unzip -q "$ARCHIVE" -d project

          # Locate the Gradle project root, including when the ZIP contains a wrapper folder.
          if [[ ! -f project/gradlew ]]; then
            ROOT="$(find project -type f -name gradlew -print -quit | xargs -r dirname)"
            if [[ -z "$ROOT" ]]; then
              echo "ERROR: gradlew was not found in the archive."
              echo "Archive contents (first 150 files):"
              find project -maxdepth 5 -type f | head -150
              exit 1
            fi
            mkdir -p project-root
            cp -a "$ROOT"/. project-root/
            rm -rf project
            mv project-root project
          fi

          chmod +x project/gradlew
          echo "Gradle project files:"
          ls -la project
          test -f project/settings.gradle || test -f project/settings.gradle.kts || true
          test -f project/build.gradle || test -f project/build.gradle.kts || true

      - name: Build with Gradle
        working-directory: project
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Upload JAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kren-debug-build
          path: |
            project/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
