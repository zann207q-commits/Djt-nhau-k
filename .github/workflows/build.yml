name: build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giai nen zip
        run: |
          ls -la
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
          echo "Tim thay: $ZIP"
          test -n "$ZIP" || { echo "Khong co file zip nao trong repo"; exit 1; }
          unzip -q "$ZIP" -d src
          ls src

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"

      - name: Build
        run: |
          DIR=$(dirname "$(find src -name settings.gradle | head -n 1)")
          echo "Build trong: $DIR"
          cd "$DIR"
          gradle build --no-daemon --console=plain

      - name: Gom file jar
        run: |
          mkdir -p dist
          find src -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} dist/ \;
          ls -la dist

      - name: Dang jar len Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*.jar
          fail_on_unmatched_files: true
