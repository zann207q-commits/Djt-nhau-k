name: Build from zip
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Giai nen zip va dung project
        run: |
          ZIP=$(ls *.zip | head -1)
          rm -rf unz build_src
          mkdir -p build_src/src/main/java build_src/src/main/resources
          unzip -q "$ZIP" -d unz
          mv unz/dev unz/x10n unz/com build_src/src/main/java/
          mv unz/assets unz/*.json build_src/src/main/resources/
          cd build_src
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  maven { url = "https://maven.fabricmc.net/" }
                  gradlePluginPortal()
              }
          }
          rootProject.name = "coindebug"
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx3G
          minecraft_version=1.21.11
          loader_version=0.18.1
          mod_version=1.9.2
          EOT
          cat > build.gradle <<'EOT'
          plugins { id "fabric-loom" version "1.14.10" }
          version = project.mod_version
          base { archivesName = "coindebug" }
          repositories {
              maven { url = "https://maven.meteordev.org/releases" }
              maven { url = "https://maven.meteordev.org/snapshots" }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"
          }
          tasks.withType(JavaCompile).configureEach {
              options.release = 21
              options.encoding = "UTF-8"
              options.compilerArgs += ["-Xmaxerrs", "1000", "-Xlint:none"]
          }
          EOT

      - name: Build
        working-directory: build_src
        run: gradle build --no-daemon --stacktrace 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Tom tat loi
        if: failure()
        run: grep -E "error:|What went wrong" -A2 build.log | head -150

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coindebug-jar
          path: |
            build_src/build/libs/*.jar
            !build_src/build/libs/*-sources.jar
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
