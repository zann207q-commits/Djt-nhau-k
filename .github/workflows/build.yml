name: Build from zip
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Giai nen zip va dung project
        run: |
          ZIP=$(ls *.zip | head -1)
          mkdir -p build_src/src/main/java build_src/src/main/resources
          unzip -q "$ZIP" -d unz
          mv unz/dev unz/x10n unz/com build_src/src/main/java/
          mv unz/assets unz/*.json build_src/src/main/resources/
          cd build_src
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  maven { url = "https://maven.fabricmc.net/" }
                  gradlePluginPortal()
              }
          }
          rootProject.name = "coindebug"
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.1
          loader_version=0.18.1
          mod_version=1.9.2
          EOT
          cat > build.gradle <<'EOT'
          plugins { id "fabric-loom" version "1.14-SNAPSHOT" }
          version = project.mod_version
          base { archivesName = "coindebug" }
          repositories {
              maven { url = "https://maven.meteordev.org/releases" }
              maven { url = "https://maven.meteordev.org/snapshots" }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"
          }
          tasks.withType(JavaCompile).configureEach {
              options.release = 21
              options.encoding = "UTF-8"
          }
          EOT

      - name: Build
        working-directory: build_src
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: coindebug-jar
          path: build_src/build/libs/*.jar
