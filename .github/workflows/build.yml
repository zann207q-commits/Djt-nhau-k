name: build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Doi 21 thanh 17 neu project cua ban dung Minecraft 1.18 - 1.20.4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (co cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cap quyen chay cho gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      # Dang file .jar thang len Releases, tai ve la file .jar, khong bi nen zip
      - name: Tao Release va dang file jar
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/libs/*.jar
          fail_on_unmatched_files: true
